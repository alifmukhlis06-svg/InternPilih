<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Forgot Password - InternPilih</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="recovery-title">
    <div class="recovery-mark"><i class="fas fa-key"></i></div>
    <h1 id="recovery-title">Reset your password</h1>
    <p class="recovery-intro">Enter the email address linked to your InternPilih account. We will send a secure reset link through Gmail.</p>

    <div class="recovery-status" id="recoveryStatus" role="status" aria-live="polite" hidden></div>

    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label" for="recoveryEmail">Email Address</label>
        <input type="email" class="form-control" id="recoveryEmail" autocomplete="email" placeholder="your@uitm.edu.my" required>
      </div>
      <button class="btn btn-primary recovery-submit" id="sendButton" type="submit">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <a class="recovery-back" href="login.html"><i class="fas fa-arrow-left"></i> Back to sign in</a>
  </section>
</main>

<script>
const appBase = window.location.protocol === 'file:'
  ? 'http://localhost/InternPilih'
  : window.location.pathname.replace(/\/forgot-password\.html$/i, '').replace(/\/$/, '');

const form = document.getElementById('forgotForm');
const button = document.getElementById('sendButton');
const statusBox = document.getElementById('recoveryStatus');

function showStatus(message, type) {
  statusBox.textContent = message;
  statusBox.className = 'recovery-status ' + type;
  statusBox.hidden = false;
}

form.addEventListener('submit', async function (event) {
  event.preventDefault();
  const email = document.getElementById('recoveryEmail').value.trim();
  if (!email) return;

  button.disabled = true;
  button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
  statusBox.hidden = true;

  try {
    const response = await fetch(appBase + '/api/password-reset.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'request', email})
    });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'Unable to send the reset email.');

    showStatus(data.message, 'success');
    form.reset();
  } catch (error) {
    showStatus(error.message || 'Password recovery is temporarily unavailable.', 'error');
  } finally {
    button.disabled = false;
    button.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
  }
});
</script>
<script src="assets/js/accessibility.js?v=20261030-a11y1"></script>
</body>
</html>
