<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InternPilih - UiTM Internship Post-Offer System</title>
<script src="assets/js/theme-init.js?v=20261031-brand4"></script>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-brand-static">
        <img class="brand-logo-image" src="assets/images/internpilih-logo.png" alt="InternPilih">
      </div>
      <h1>InternPilih</h1>
      <p>UiTM Internship Post-Offer Management System</p>
    </div>

    <div class="role-select">
      <button class="role-btn active" id="role-student" onclick="setRole('student')">
        <i class="fas fa-user-graduate"></i>
        <span>Student</span>
      </button>
      <button class="role-btn" id="role-admin" onclick="setRole('admin')">
        <i class="fas fa-user-shield"></i>
        <span>Coordinator</span>
      </button>
      <button class="role-btn" id="role-employer" onclick="setRole('employer')">
        <i class="fas fa-building"></i>
        <span>Employer</span>
      </button>
    </div>

    <div class="form-group">
      <label class="form-label" id="identifierLabel" for="identifier">Student ID</label>
      <input type="text" class="form-control" id="identifier" placeholder="Enter your Student ID" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-wrap">
        <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password">
        <button class="password-toggle" onclick="togglePwd()" aria-label="Show or hide password"><i class="fas fa-eye" id="eye-icon"></i></button>
      </div>
    </div>
    <div class="form-options">
      <label class="check-label">
        <input type="checkbox" checked> Remember me
      </label>
      <a href="forgot-password.html" class="login-link">Forgot password?</a>
    </div>
    <button class="btn btn-primary login-submit" onclick="doLogin()">
      <i class="fas fa-sign-in-alt"></i> Sign In
    </button>

    <div class="demo-accounts" id="staging-demo-accounts" hidden>
      <p><i class="fas fa-key"></i> Staging Demo Accounts</p>
      <div id="staging-demo-list"></div>
      <span>Use the privately configured staging test password.</span>
    </div>
  </div>
</div>

<script>
let currentRole='student';
const demoAccountsByRole={student:[],admin:[],employer:[]};
const loginBasePath = window.location.protocol === 'file:'
  ? 'http://localhost/InternPilih'
  : window.location.pathname.replace(/\/login\.html$/i, '').replace(/\/$/, '');
function appPath(path) {
  return (loginBasePath || '') + path;
}
function setRole(r){
  currentRole=r;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('role-'+r).classList.add('active');
  const student=r==='student';
  const label=student?'Student ID':r==='admin'?'Staff ID':'Email Address';
  document.getElementById('identifierLabel').textContent=label;
  document.getElementById('identifier').placeholder='Enter your '+label;
  const account=demoAccountsByRole[r]?.[0];
  document.getElementById('identifier').value=account?.identifier||'';
}
function fillDemo(r,identifier){
  setRole(r);
  document.getElementById('identifier').value=identifier;
  document.getElementById('password').focus();
}
async function loadDemoAccounts(){
  const panel=document.getElementById('staging-demo-accounts');
  const list=document.getElementById('staging-demo-list');
  try{
    const res=await fetch(appPath('/api/auth.php'),{headers:{'Accept':'application/json'}});
    const data=await res.json();
    const accounts=Array.isArray(data.demo_accounts)?data.demo_accounts:[];
    const roleLabels={student:'Student',admin:'Coordinator',employer:'Employer'};
    const roleIcons={student:'fas fa-user-graduate',admin:'fas fa-user-shield',employer:'fas fa-building'};
    accounts.forEach(account=>{
      if(!account||!roleLabels[account.role]||typeof account.identifier!=='string')return;
      demoAccountsByRole[account.role].push(account);
      const row=document.createElement('div');
      row.className='demo-row';
      const description=document.createElement('span');
      const icon=document.createElement('i');
      icon.className=roleIcons[account.role];
      description.append(icon,document.createTextNode(` ${roleLabels[account.role]} - ${account.identifier}`));
      const button=document.createElement('button');
      button.type='button';
      button.className='demo-fill';
      button.textContent='Use';
      button.addEventListener('click',()=>fillDemo(account.role,account.identifier));
      row.append(description,button);
      list.appendChild(row);
    });
    if(list.children.length){
      panel.hidden=false;
      const firstStudent=demoAccountsByRole.student[0];
      if(firstStudent&&!document.getElementById('identifier').value){
        document.getElementById('identifier').value=firstStudent.identifier;
      }
    }
  }catch(_){
    panel.hidden=true;
  }
}
function togglePwd(){
  const inp=document.getElementById('password');
  const icon=document.getElementById('eye-icon');
  if(inp.type==='password'){inp.type='text';icon.className='fas fa-eye-slash';}
  else{inp.type='password';icon.className='fas fa-eye';}
}
async function doLogin(){
  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.querySelector('.btn-primary');

  const identifierLabel=currentRole==='student'?'Student ID':currentRole==='admin'?'Staff ID':'email';
  if (!identifier || !password) { showErr(`Please enter ${identifierLabel} and password.`); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

  try {
    const res  = await fetch(appPath('/api/auth.php'), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ role: currentRole, identifier, password })
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      showErr(data.error || `Invalid ${identifierLabel} or password.`);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      return;
    }

    const role = data.user.role;
    const destinations = {
      student:  'student/dashboard.html',
      admin:    'admin/dashboard.html',
      employer: 'employer/dashboard.html'
    };
    window.location.href = appPath('/' + (destinations[role] || 'login.html'));

  } catch(e) {
    showErr('Cannot reach the login service. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
  }
}

function showErr(msg) {
  let el = document.getElementById('login-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'login-error';
    el.className = 'login-error';
    document.querySelector('.btn-primary').before(el);
  }
  el.textContent = msg;
}

// Allow Enter key to submit
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
loadDemoAccounts();
</script>
<script src="assets/js/app.js?v=20261031-brand4"></script>
</body>
</html>
