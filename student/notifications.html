<div class="main">
  <div class="topbar">
    <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <div><h1>Notifications</h1><p class="topbar-sub">3 unread notifications</p></div>
    <div class="topbar-right">
      <button class="btn btn-outline btn-sm" onclick="markAllRead(event)"><i class="fas fa-check-double"></i> Mark All Read</button>
    </div>
  </div>

  <div class="content fade-in">
    <div class="max-readable">
      <div class="tab-nav">
        <button class="tab-btn active" data-filter="all" onclick="filterNotif('all',this)">All</button>
        <button class="tab-btn" data-filter="unread" onclick="filterNotif('unread',this)">Unread</button>
        <button class="tab-btn" data-filter="system" onclick="filterNotif('system',this)">System</button>
        <button class="tab-btn" data-filter="admin" onclick="filterNotif('admin',this)">From Admin</button>
      </div>

      <div class="panel">
        <div class="panel-section" id="notifList">

          <div class="empty-state" id="notifEmptyState"><i class="fas fa-spinner fa-spin"></i><p>Loading notifications...</p></div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
async function markAllRead(event){
  const btn=event.currentTarget;
  try{
    const res=await fetch('../api/notifications.php',{method:'PUT'});
    if(!res.ok) throw new Error('Unable to update notifications.');
    document.querySelectorAll('.unread-marker').forEach(m=>m.remove());
    document.querySelectorAll('.notif-item').forEach(i=>{
      i.style.opacity='0.72';
      i.dataset.type=(i.dataset.type||'').replace('unread','').trim();
    });
    const topbar=document.querySelector('.topbar p');
    if(topbar) topbar.textContent='0 unread notifications';
    updateNotifCounts();
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab) {
      filterNotif(activeTab.dataset.filter || 'all', activeTab);
    }
    btn.innerHTML='<i class="fas fa-check"></i> All Read';
    if(window.refreshStudentNotifications) await window.refreshStudentNotifications();
  }catch(err){
    alert('Unable to update notifications.');
  }
  setTimeout(()=>btn.innerHTML='<i class="fas fa-check-double"></i> Mark All Read',2000);
}
function filterNotif(type,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const list = document.getElementById('notifList');
  if (list.dataset.loadError === 'true') return;
  const empty = ensureNotifEmptyState(list);
  let visibleCount = 0;

  document.querySelectorAll('.notif-item').forEach(item=>{
    const visible = type === 'all' || (item.dataset.type && item.dataset.type.includes(type));
    item.style.display = visible ? 'flex' : 'none';
    if (visible) visibleCount++;
  });

  const labels = {
    all: 'No notifications yet.',
    unread: 'No unread notifications.',
    system: 'No system notifications.',
    admin: 'No coordinator notifications.'
  };
  empty.querySelector('p').textContent = labels[type] || 'No notifications match this filter.';
  empty.style.display = visibleCount ? 'none' : 'block';
}

function updateNotifCounts() {
  const items = Array.from(document.querySelectorAll('#notifList .notif-item'));
  const counts = {
    all: items.length,
    unread: items.filter(item => (item.dataset.type || '').includes('unread')).length,
    system: items.filter(item => (item.dataset.type || '').includes('system')).length,
    admin: items.filter(item => (item.dataset.type || '').includes('admin')).length
  };
  const labels = {
    all: 'All',
    unread: 'Unread',
    system: 'System',
    admin: 'From Admin'
  };
  document.querySelectorAll('.tab-btn').forEach(tab => {
    const filter = tab.dataset.filter || 'all';
    tab.textContent = `${labels[filter] || labels.all} (${counts[filter] || 0})`;
  });
}

function ensureNotifEmptyState(list) {
  let empty = document.getElementById('notifEmptyState');
  if (empty) return empty;

  empty = document.createElement('div');
  empty.id = 'notifEmptyState';
  empty.className = 'empty-state';
  empty.style.display = 'none';
  empty.innerHTML = '<i class="fas fa-inbox"></i><p>No notifications match this filter.</p>';
  list.appendChild(empty);
  return empty;
}

document.addEventListener('DOMContentLoaded', function () {
  const list = document.getElementById('notifList');
  if (!list) return;

  const syncCurrentView = function () {
    updateNotifCounts();
    const activeTab = document.querySelector('.tab-btn.active') || document.querySelector('[data-filter="all"]');
    filterNotif(activeTab.dataset.filter || 'all', activeTab);
  };

  syncCurrentView();
  new MutationObserver(syncCurrentView).observe(list, { childList:true });
});
</script>
  <script src="../assets/js/app.js?v=20261028-1"></script>
