<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Pending - InternPilih</title>
<script src="assets/js/theme-init.js?v=20261031-classic1"></script>
<link rel="stylesheet" href="assets/css/style.css?v=20261119-auth1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<main class="login-page">
  <section class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="fas fa-user-clock"></i></div>
      <h1>Access pending</h1>
      <p>Your UiTM account is valid, but you are not yet registered for InternPilih. Please contact your internship coordinator.</p>
    </div>
    <button type="button" class="btn btn-outline login-submit" id="use-another-account">
      <i class="fas fa-arrow-right-from-bracket"></i> Use another account / Logout
    </button>
    <a class="btn btn-primary login-submit" style="margin-top:10px;" href="login.html" id="return-to-login">
      Return to login
    </a>
  </section>
</main>
<script src="assets/js/google-auth.js?v=20261119-auth1"></script>
<script>
async function leavePendingAccess(event){
  event?.preventDefault();
  const target=event?.currentTarget;
  if(target?.tagName==='BUTTON') target.disabled=true;
  await window.InternPilihGoogleAuth.signOut();
  await fetch(window.InternPilihGoogleAuth.appPath('/api/auth.php'),{method:'DELETE'}).catch(()=>{});
  sessionStorage.removeItem('internpilih:access-pending');
  sessionStorage.removeItem('user');
  window.location.replace(window.InternPilihGoogleAuth.appPath('/login.html'));
}
document.getElementById('use-another-account').addEventListener('click',leavePendingAccess);
document.getElementById('return-to-login').addEventListener('click',leavePendingAccess);
</script>
</body>
</html>
