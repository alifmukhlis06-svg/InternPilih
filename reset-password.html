<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Choose New Password - InternPilih</title>
<script src="assets/js/theme-init.js?v=20261031-brand4"></script>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<main class="recovery-page">
  <section class="recovery-card" aria-labelledby="reset-title">
    <div class="recovery-mark"><i class="fas fa-lock"></i></div>
    <h1 id="reset-title">Choose a new password</h1>
    <p class="recovery-intro">Create a password you do not use for another account.</p>

    <div class="recovery-status" id="resetStatus" role="status" aria-live="polite">
      <i class="fas fa-spinner fa-spin"></i> Checking your reset link...
    </div>

    <form id="resetForm" hidden>
      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <input type="password" class="form-control" id="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
        <p class="password-requirement">Use at least 8 characters.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
      </div>
      <button class="btn btn-primary recovery-submit" id="resetButton" type="submit">
        <i class="fas fa-shield-alt"></i> Update Password
      </button>
    </form>

    <a class="recovery-back" href="login.html"><i class="fas fa-arrow-left"></i> Back to sign in</a>
  </section>
</main>

<script>
const appBase = window.location.protocol === 'file:'
  ? 'http://localhost/InternPilih'
  : window.location.pathname.replace(/\/reset-password\.html$/i, '').replace(/\/$/, '');
const token = new URLSearchParams(window.location.search).get('token') || '';
const form = document.getElementById('resetForm');
const button = document.getElementById('resetButton');
const statusBox = document.getElementById('resetStatus');

function showStatus(message, type) {
  statusBox.textContent = message;
  statusBox.className = 'recovery-status ' + type;
  statusBox.hidden = false;
}

async function validateLink() {
  if (!/^[a-f0-9]{64}$/i.test(token)) {
    showStatus('This reset link is invalid or incomplete. Request a new link from the sign-in page.', 'error');
    return;
  }

  try {
    const response = await fetch(appBase + '/api/password-reset.php?token=' + encodeURIComponent(token));
    const data = await response.json();
    if (!response.ok || !data.valid) {
      showStatus('This reset link has expired or has already been used. Request a new link from the sign-in page.', 'error');
      return;
    }

    statusBox.hidden = true;
    form.hidden = false;
    document.getElementById('newPassword').focus();
  } catch (error) {
    showStatus('Password recovery is temporarily unavailable. Please try again later.', 'error');
  }
}

form.addEventListener('submit', async function (event) {
  event.preventDefault();
  const password = document.getElementById('newPassword').value;
  const confirmation = document.getElementById('confirmPassword').value;

  if (password.length < 8) {
    showStatus('Use a password with at least 8 characters.', 'error');
    return;
  }
  if (password !== confirmation) {
    showStatus('The passwords do not match.', 'error');
    return;
  }

  button.disabled = true;
  button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

  try {
    const response = await fetch(appBase + '/api/password-reset.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({action:'reset', token, password})
    });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'Unable to update your password.');

    form.hidden = true;
    showStatus(data.message, 'success');
    document.querySelector('.recovery-back').innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign in with your new password';
  } catch (error) {
    showStatus(error.message || 'Unable to update your password.', 'error');
    button.disabled = false;
    button.innerHTML = '<i class="fas fa-shield-alt"></i> Update Password';
  }
});

validateLink();
</script>
<script src="assets/js/accessibility.js?v=20261031-brand4"></script>
</body>
</html>
